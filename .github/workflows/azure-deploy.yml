name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: nicksiteregistry
  CONTAINER_APP_NAME: nicksite-app
  RESOURCE_GROUP: nicksite-rg
  IMAGE_NAME: nicksite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Generate templ files
      run: go run github.com/a-h/templ/cmd/templ@v0.3.977 generate

    - name: Run tests
      run: go test ./... -count=1

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build \
          -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
          -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
        docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

    - name: Save current revision for rollback
      id: pre_deploy
      run: |
        CURRENT_IMAGE=$(az containerapp show \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "none")
        echo "previous_image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"

    - name: Deploy to Azure Container Apps
      run: |
        az containerapp update \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          --set-env-vars ENV=production ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }}"

    - name: Verify deployment health
      run: |
        APP_URL=$(az containerapp show \
          --name ${{ env.CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "properties.configuration.ingress.fqdn" -o tsv)

        echo "Waiting for deployment to stabilize..."
        sleep 15

        MAX_RETRIES=5
        RETRY_DELAY=10
        for i in $(seq 1 $MAX_RETRIES); do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$APP_URL/health" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Health check passed (attempt $i/$MAX_RETRIES)"
            exit 0
          fi
          echo "Attempt $i/$MAX_RETRIES returned $HTTP_STATUS, retrying in ${RETRY_DELAY}s..."
          sleep $RETRY_DELAY
        done

        echo "Health check failed — rolling back..."
        if [ "${{ steps.pre_deploy.outputs.previous_image }}" != "none" ]; then
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ steps.pre_deploy.outputs.previous_image }}"
        fi
        exit 1

    - name: Logout from Azure
      if: always()
      run: az logout
